on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pip
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install --break-system-packages -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install --break-system-packages -e ".[dev]"; fi
      - name: Lint
        run: |
          pip install --break-system-packages ruff
          ruff check .
      - name: Test
        run: |
          if [ -f pytest.ini ] || [ -f setup.cfg ] || [ -d tests ]; then
            pip install --break-system-packages pytest
            pytest
          fi
      - name: Docs link check
        run: python3 scripts/check_docs_links.py
      - name: Secret scan (gitleaks)
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) GL_ASSET=gitleaks_8.24.3_linux_x64 ;;
            aarch64|arm64) GL_ASSET=gitleaks_8.24.3_linux_arm64 ;;
            *) echo "unsupported arch $ARCH"; exit 1 ;;
          esac
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/${GL_ASSET}.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --no-git --redact --verbose
