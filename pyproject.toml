[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-flywheel"
dynamic = ["version"]
description = "Local-first grocery runway and decision-fatigue workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grocery-flywheel = "grocery_flywheel.cli:main"
grocery-flywheel-mcp = "grocery_flywheel.mcp_server:main"
grocery-flywheel-capture-visit = "grocery_flywheel.capture_visit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "grocery_flywheel.__version__" }

[tool.ruff.lint]
# Explicit selection: ruff's implicit default rule set changed in newer
# releases (0.16+ flags I/DTZ/UP/PL out of the box), which made `ruff check .`
# depend on the installed ruff version. Pin the classic default set so CI is
# deterministic. Widen deliberately, not by linter upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
