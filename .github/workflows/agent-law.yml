name: Agent Law

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/agent-law/**"
      - ".github/pull_request_template.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/agent-law.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-law:
    name: agent-law
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Empower Orchestrator law (single copy + pointers)
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          if [[ ! -f "docs/agent-law/empower-orchestrator.md" ]]; then
            echo "::error file=docs/agent-law/empower-orchestrator.md::The single canonical copy is missing"
            fail=1
          elif ! grep -q 'four-question blast-radius check' docs/agent-law/empower-orchestrator.md; then
            echo "::error file=docs/agent-law/empower-orchestrator.md::Recipe must name the four-question blast-radius check"
            fail=1
          fi

          # Every carrier file must carry the marker and POINT at the canonical
          # copy — and must not inline the law text itself (single-copy rule).
          for path in AGENTS.md CLAUDE.md .github/pull_request_template.md; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Required file is missing"
              fail=1
              continue
            fi
            if ! grep -q 'EMPOWER_ORCHESTRATOR:START' "$path"; then
              echo "::error file=$path::Missing EMPOWER_ORCHESTRATOR marker"
              fail=1
            fi
            if ! grep -q 'docs/agent-law/empower-orchestrator.md' "$path"; then
              echo "::error file=$path::Must point at the canonical law copy"
              fail=1
            fi
            if grep -q 'audition to improve the system' "$path"; then
              echo "::error file=$path::Inlines the law instead of pointing at the single copy"
              fail=1
            fi
          done

          if [[ "$fail" != 0 ]]; then
            exit 1
          fi

          echo "Empower Orchestrator law: one copy, pointers verified."
